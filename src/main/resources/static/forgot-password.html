<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Forgot Password - MoonLit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="logo">🌙 MoonLit</div>
    <div class="card">
        <h2 style="margin-bottom:15px;">Reset Password</h2>
        <input type="email" id="email" placeholder="Enter your email">
        <div class="error" id="msg"></div>
        <button class="btn" style="width:100%; margin-top:10px;" onclick="submitReset()">Send Reset Link</button>
        <p style="margin-top:15px;"><a href="login.html" class="link">Back to Log In</a></p>
    </div>
</div>

<script>
    async function submitReset() {
      const msg = document.getElementById('msg');
      const email = document.getElementById('email').value;

      const res = await fetch('/api/auth/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      const data = await res.json();
      msg.style.color = '#a78bfa';
      msg.textContent = data.message;
    }
</script>
</body>
</html>
