<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log In - MoonLit</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
    <div class="logo">🌙 MoonLit</div>
    <div class="card">
        <h2 style="margin-bottom:15px;">Log In</h2>
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="password" placeholder="Password">
        <div class="error" id="errorMsg"></div>
        <button class="btn" style="width:100%; margin-top:10px;" onclick="login()">Log In</button>
        <p style="margin-top:15px;"><a href="signup.html" class="link">Don't have an account? Sign up</a></p>
        <p style="margin-top:8px;"><a href="forgot-password.html" class="link">Forgot password?</a></p>
    </div>
</div>

<script>
    async function login() {
      const errorMsg = document.getElementById('errorMsg');
      errorMsg.textContent = '';

      const body = {
        email: document.getElementById('email').value,
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.error || 'Login failed';
          return;
        }

        localStorage.setItem('token', data.token);
        localStorage.setItem('user', JSON.stringify(data));
        window.location.href = 'dashboard.html';

      } catch (err) {
        errorMsg.textContent = 'Something went wrong. Try again.';
      }
    }
</script>
</body>
</html>
